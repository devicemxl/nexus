<!DOCTYPE html>
<!--
    Descripcion:
    Ejemplo de uso de PulsarJS directamente en el navegador, sin Node.js.
    Muestra como crear un almacen de estado, suscribirse a un selector,
    actualizar el estado, usar la funcion de fabrica y cancelar una suscripcion.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PulsarJS - Browser Native</title>
</head>
<body>
    <h1>PulsarJS - Sin Node.js</h1>

    <script type="module">
        // Importa el almacen y la funcion de fabrica directamente desde el archivo.
        import { Pulsar, createStatePulsar } from '../../src/pulsar.js';

        // Crea un almacen con el estado inicial de la interfaz y sus entidades.
        const store = new Pulsar({
            ui: {
                selectedNode: null,
                activeTool: 'select'
            },
            entities: {}
        });

        // Se suscribe al cambio del nodo seleccionado y ejecuta el callback
        // inmediatamente con el valor actual.
        const unsub = store.subscribeSelector(
            'ui.selectedNode',
            (nodeId, prevNodeId) => {
                // Informa en consola el valor anterior y el nuevo valor.
                console.log(`Selección: ${prevNodeId} -> ${nodeId}`);
            },
            { immediate: true }
        );

        // Actualiza solo la seleccion, conservando el resto del estado de la interfaz.
        store.setState({
            ui: {
                ...store.getState().ui,
                selectedNode: 'node:42'
            }
        });

        // Tambien puedes crear un almacen sencillo usando la funcion de fabrica.
        const store2 = createStatePulsar({ count: 0 });
        // Se suscribe a los cambios de la propiedad count.
        store2.subscribeSelector('count', (value) => {
            // Muestra el nuevo contador en la consola.
            console.log('Count:', value);
        });
        // Cambia el contador y notifica a la suscripcion anterior.
        store2.setState({ count: 5 });

        // Cancela la suscripcion al nodo seleccionado para dejar de recibir avisos.
        unsub();
    </script>
</body>
</html>
