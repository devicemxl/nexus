<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chunklet CP3 - Multi-behavior</title>
  <style>
    .box { 
      width: 200px; 
      height: 100px; 
      border: 2px solid #333; 
      padding: 20px;
      margin: 20px 0;
      background: #f0f0f0;
    }
    .resizable { resize: both; overflow: auto; }
    .draggable { cursor: grab; }
    .dragging { opacity: 0.7; }
    .log { margin-top: 20px; padding: 10px; background: #2d2d2d; color: #4ec9b0; font-family: monospace; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Chunklet CP3 - Multi-behavior</h1>

  <div id="app">
    <!-- Múltiples comportamientos en un solo elemento -->
    <div class="box" data-chunk="draggable selectable resizable" id="multi">
      Soy un elemento con 3 comportamientos
    </div>
  </div>

  <div>
    <button id="addBehavior">Añadir 'highlight'</button>
    <button id="removeBehavior">Eliminar 'resizable'</button>
    <button id="unmountAll">Desmontar todo</button>
  </div>

  <div class="log" id="log"></div>

  <script type="module">
    import { define, mount, unmount } from '../src/chunklet.js';

    const log = document.getElementById('log');
    function logMessage(msg) {
      const entry = document.createElement('div');
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    // ------------------------------------------------
    // Definir comportamientos con orden de ejecución
    // ------------------------------------------------

    define('draggable', (element, ctx) => {
      const name = 'draggable';
      logMessage(`🔧 Montando ${name}`);
      
      let isDragging = false;
      let startX, startY;

      function onMouseDown(e) {
        isDragging = true;
        startX = e.clientX - element.offsetLeft;
        startY = e.clientY - element.offsetTop;
        element.classList.add('dragging');
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      }

      function onMouseMove(e) {
        if (!isDragging) return;
        element.style.left = (e.clientX - startX) + 'px';
        element.style.top = (e.clientY - startY) + 'px';
      }

      function onMouseUp() {
        isDragging = false;
        element.classList.remove('dragging');
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      }

      ctx.listen(element, 'mousedown', onMouseDown);
      ctx.cleanup(() => {
        logMessage(`🧹 Limpiando ${name}`);
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      });

      logMessage(`✅ ${name} montado`);
      
      return {
        destroy: () => {
          logMessage(`💥 Destroy personalizado de ${name}`);
        }
      };
    });

    define('selectable', (element, ctx) => {
      const name = 'selectable';
      logMessage(`🔧 Montando ${name}`);

      let selected = false;

      function onClick() {
        selected = !selected;
        element.style.borderColor = selected ? 'blue' : '#333';
        element.style.borderWidth = selected ? '4px' : '2px';
        logMessage(`📌 ${name}: ${selected ? 'seleccionado' : 'deseleccionado'}`);
      }

      ctx.listen(element, 'click', onClick);
      ctx.cleanup(() => {
        logMessage(`🧹 Limpiando ${name}`);
        element.style.borderColor = '#333';
        element.style.borderWidth = '2px';
      });

      logMessage(`✅ ${name} montado`);
    });

    define('resizable', (element, ctx) => {
      const name = 'resizable';
      logMessage(`🔧 Montando ${name}`);

      element.classList.add('resizable');

      ctx.cleanup(() => {
        logMessage(`🧹 Limpiando ${name}`);
        element.classList.remove('resizable');
      });

      logMessage(`✅ ${name} montado`);
    });

    define('highlight', (element, ctx) => {
      const name = 'highlight';
      logMessage(`🔧 Montando ${name}`);

      element.style.backgroundColor = 'yellow';
      element.style.transition = 'background-color 0.3s';

      ctx.cleanup(() => {
        logMessage(`🧹 Limpiando ${name}`);
        element.style.backgroundColor = '';
      });

      logMessage(`✅ ${name} montado`);
    });

    // ------------------------------------------------
    // Montar inicial
    // ------------------------------------------------

    const app = document.getElementById('app');
    mount(app);
    logMessage('🚀 Montaje inicial completado');

    // ------------------------------------------------
    // Botones de control
    // ------------------------------------------------

    document.getElementById('addBehavior').addEventListener('click', () => {
      const el = document.getElementById('multi');
      const current = el.getAttribute('data-chunk');
      if (!current.includes('highlight')) {
        el.setAttribute('data-chunk', current + ' highlight');
        mount(el);
        logMessage('➕ Añadido comportamiento "highlight"');
      } else {
        logMessage('⚠️ "highlight" ya está presente');
      }
    });

    document.getElementById('removeBehavior').addEventListener('click', () => {
      const el = document.getElementById('multi');
      const current = el.getAttribute('data-chunk');
      const names = current.split(/\s+/).filter(n => n !== 'resizable');
      el.setAttribute('data-chunk', names.join(' '));
      // Necesitamos desmontar y volver a montar para eliminar el comportamiento
      // Nota: esto es un poco drástico, pero es un ejemplo.
      // En una implementación real, tendríamos un método para eliminar un comportamiento específico.
      unmount(el);
      mount(el);
      logMessage('➖ Eliminado "resizable" (desmontado y remontado)');
    });

    document.getElementById('unmountAll').addEventListener('click', () => {
      unmount(app);
      logMessage('🧹 Desmontado todo');
    });

    // Mostrar orden de montaje al cargar
    logMessage('ℹ️ El orden de montaje es: draggable → selectable → resizable');
    logMessage('ℹ️ El orden de desmontaje será: resizable → selectable → draggable');
  </script>
</body>
</html>
