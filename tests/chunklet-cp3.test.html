<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chunklet CP3 - Integración con Pulsar</title>
  <style>
    .active { background: #4ec9b0; color: #1e1e1e; padding: 10px; }
    .inactive { background: #333; color: #d4d4d4; padding: 10px; }
  </style>
</head>
<body>
  <h1>Chunklet CP3 - Integración con Pulsar</h1>
  <div id="app">
    <div id="element1" data-chunk="draggable selectable resizable">Elemento 1</div>
    <div id="element2" data-chunk="draggable highlight">Elemento 2</div>
  </div>
  <div>
    <button id="enableDraggable">Habilitar draggable en el1</button>
    <button id="disableResizable">Deshabilitar resizable en el1</button>
    <button id="showState">Mostrar estado</button>
  </div>
  <pre id="stateDisplay"></pre>

  <script type="module">
    import { createStatePulsar } from '../src/pulsar.js';
    import { define, mount, enableBehavior, disableBehavior } from '../src/chunklet.js';

    // Crear store
    const store = createStatePulsar({
      ui: {
        behaviors: {
          'el1': ['draggable', 'selectable', 'resizable'],
          'el2': ['draggable', 'highlight']
        }
      }
    });

    // Definir comportamientos
    define('draggable', (el, ctx) => {
      console.log('🟢 draggable montado en', el);
      el.classList.add('active');
      return {
        destroy: () => {
          console.log('🔴 draggable desmontado');
          el.classList.remove('active');
        }
      };
    });

    define('selectable', (el, ctx) => {
      console.log('🟢 selectable montado en', el);
      el.style.border = '2px solid blue';
      ctx.listen(el, 'click', () => {
        console.log('📌 selectable: click en', el);
      });
      return {
        destroy: () => {
          console.log('🔴 selectable desmontado');
          el.style.border = '';
        }
      };
    });

    define('resizable', (el, ctx) => {
      console.log('🟢 resizable montado en', el);
      el.style.resize = 'both';
      return {
        destroy: () => {
          console.log('🔴 resizable desmontado');
          el.style.resize = '';
        }
      };
    });

    define('highlight', (el, ctx) => {
      console.log('🟢 highlight montado en', el);
      el.style.background = 'yellow';
      return {
        destroy: () => {
          console.log('🔴 highlight desmontado');
          el.style.background = '';
        }
      };
    });

    // Montar con Pulsar
    const app = document.getElementById('app');
    mount(app, { pulsarStore: store, statePath: 'ui.behaviors' });

    // Mostrar estado
    function showState() {
      const state = store.getState();
      document.getElementById('stateDisplay').textContent = JSON.stringify(state.ui.behaviors, null, 2);
    }
    showState();

    // Botones de control
    const el1 = document.getElementById('element1');

    document.getElementById('enableDraggable').addEventListener('click', () => {
      enableBehavior(el1, 'draggable', store);
      showState();
    });

    document.getElementById('disableResizable').addEventListener('click', () => {
      disableBehavior(el1, 'resizable', store);
      showState();
    });

    document.getElementById('showState').addEventListener('click', showState);
  </script>
</body>
</html>
