<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Binder CP4 - Submit</title>
  <style>
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h1>Binder CP4 - Submit</h1>
  <form id="testForm">
    <label>Nombre: <input type="text" data-bind="user.name"></label><br>
    <label>Email: <input type="email" data-bind="user.email"></label><br>
    <button type="button" id="submitBtn">Enviar</button>
    <button type="button" id="resetBtn">Reset</button>
    <div id="status"></div>
  </form>

  <script type="module">
    import { createStatePulsar } from '../src/pulsar.js';
    import { createBinder } from '../src/binder.js';

    const store = createStatePulsar({});
    const binder = createBinder(store, { key: 'myForm' });

    binder.bind('#testForm');

    function validateForm(data) {
      const errors = {};
      if (!data.user?.name || data.user.name.length < 3) {
        errors['user.name'] = 'Nombre debe tener al menos 3 caracteres';
      }
      if (!data.user?.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.user.email)) {
        errors['user.email'] = 'Email inválido';
      }
      return Object.keys(errors).length > 0 ? errors : null;
    }

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const status = document.getElementById('status');
      try {
        const result = await binder.submit(async (data) => {
          // Simular llamada API
          status.textContent = 'Enviando...';
          await new Promise(resolve => setTimeout(resolve, 1000));
          if (data.user.name === 'error') {
            throw new Error('Simulación de error de servidor');
          }
          return { success: true, data };
        }, { validateFn: validateForm });

        status.innerHTML = `<span class="success">✅ Envío exitoso: ${JSON.stringify(result)}</span>`;
      } catch (error) {
        if (error.validationErrors) {
          status.innerHTML = `<span class="error">❌ Errores de validación: ${JSON.stringify(error.validationErrors)}</span>`;
        } else {
          status.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
        }
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      binder.reset({ user: { name: '', email: '' } });
      document.getElementById('status').textContent = 'Formulario reseteado';
    });

    // Suscribirse para ver cambios
    store.subscribeSelector('myForm', (formData) => {
      console.log('Estado del formulario:', formData);
    }, { immediate: true });
  </script>
</body>
</html>
