<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PulsarJS - Tests de Contrato</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    .pass { color: #4ec9b0; }
    .fail { color: #f44747; }
    .test { padding: 4px 0; border-bottom: 1px solid #333; }
    .section { margin-top: 20px; padding: 6px 0; color: #dcdcaa; font-weight: bold; border-bottom: 2px solid #333; }
  </style>
</head>
<body>
  <h1>🧪 PulsarJS Contract Tests v0.2.1 (código v0.2.2)</h1>
  <div id="output"></div>

  <script type="module">
    import { createStatePulsar } from '../src/pulsar.js';

    const output = document.getElementById('output');
    let passed = 0;
    let failed = 0;

    function section(title) {
      const div = document.createElement('div');
      div.className = 'section';
      div.textContent = title;
      output.appendChild(div);
    }

    function assert(condition, message) {
      const div = document.createElement('div');
      div.className = 'test';
      if (condition) {
        div.innerHTML = `✅ <span class="pass">${message}</span>`;
        passed++;
      } else {
        div.innerHTML = `❌ <span class="fail">${message}</span>`;
        failed++;
      }
      output.appendChild(div);
      console.assert(condition, message);
    }

    // ============================================================
    // TESTS ORIGINALES DEL CONTRATO v0.2.0
    // ============================================================

    section('TEST 1: setState con shallow merge');
    const store = createStatePulsar({ ui: { theme: 'dark' }, count: 0 });
    store.setState({ ui: { selected: 'node1' }, count: 5 });
    const state = store.getState();
    assert(state.ui.theme === undefined, 'setState reemplaza el objeto "ui" completo (no merge profundo)');
    assert(state.ui.selected === 'node1', 'setState agrega nuevas propiedades en el nivel raíz');
    assert(state.count === 5, 'setState actualiza valores planos correctamente');

    section('TEST 2: subscribeSelector con string (incluyendo bracket notation)');
    const store2 = createStatePulsar({
      items: [{ label: 'Apple', price: 1.2 }, { label: 'Banana', price: 0.8 }]
    });

    let lastValue = null;
    const unsub = store2.subscribeSelector(
      'items[0].label',
      (value) => { lastValue = value; },
      { immediate: true }
    );

    assert(lastValue === 'Apple', 'subscribeSelector con bracket notation (inmediato) devuelve "Apple"');

    store2.setState({ items: [{ label: 'Orange', price: 1.5 }, { label: 'Banana', price: 0.8 }] });
    assert(lastValue === 'Orange', 'subscribeSelector con bracket notation actualiza a "Orange"');

    unsub();
    store2.setState({ items: [{ label: 'Grape', price: 2.0 }, { label: 'Banana', price: 0.8 }] });
    assert(lastValue === 'Orange', 'Unsubscribe evita que el listener se ejecute (sigue siendo "Orange")');

    section('TEST 3: subscribeSelector con función selector');
    const store3 = createStatePulsar({ a: 5, b: 10 });
    let sum = null;
    store3.subscribeSelector(
      (state) => state.a + state.b,
      (value) => { sum = value; },
      { immediate: true }
    );
    assert(sum === 15, 'Selector de función calcula la suma correctamente (15)');

    store3.setState({ a: 20 });
    assert(sum === 30, 'Selector de función se actualiza a 30');

    section('TEST 4: Reentrancy — suscripción creada dentro de notificación');
    const store4 = createStatePulsar({ counter: 0 });
    let innerCalled = false;
    const outerUnsub = store4.subscribeSelector('counter', (val) => {
      if (val === 1) {
        store4.subscribeSelector('counter', (v2) => {
          innerCalled = (v2 === 2);
        }, { immediate: false });
      }
    });

    store4.setState({ counter: 1 }); // dispara outer, crea inner
    store4.setState({ counter: 2 }); // la nueva suscripción debe verlo
    assert(innerCalled === true, 'Suscripción creada dentro de notificación recibe el siguiente cambio');

    outerUnsub();

    section('TEST 5: Inmutabilidad (deep freeze real) — P-T1');
    // El test previo solo verificaba que el valor no cambiaba tras un intento
    // de mutación, lo cual pasa incluso con freeze shallow (el nested no
    // cambia porque nadie logra escribir en él en no-strict, y en strict
    // el error se captura). Para verificar que el freeze es DEEP, hay que
    // preguntar explícitamente por `Object.isFrozen` en cada nivel.
    const store5 = createStatePulsar({
      nested: { value: 42, deeper: { flag: true } }
    }, { freeze: true });
    const s5 = store5.getState();

    assert(Object.isFrozen(s5), 'freeze: nivel raíz está congelado');
    assert(Object.isFrozen(s5.nested), 'freeze: nivel intermedio (nested) está congelado');
    assert(Object.isFrozen(s5.nested.deeper), 'freeze: nivel profundo (nested.deeper) está congelado');
    assert(s5.nested.value === 42, 'freeze: los valores del estado son accesibles');
    assert(s5.nested.deeper.flag === true, 'freeze: los valores profundos son accesibles');

    // ============================================================
    // TESTS PARA CAMBIOS DE v0.2.1
    // ============================================================

    section('TEST 6: Simetría de "immediate" en subscribeSelector (fix v0.2.1)');
    // Antes del fix: el listener se invocaba inmediatamente ANTES de registrarse
    // en el mapa. Si el callback disparaba un setState reentrante, la notificación
    // resultante no alcanzaba al propio listener (aún no registrado).
    // Después del fix: el listener se registra ANTES de invocarse. Un setState
    // reentrante desde el callback inmediato debe notificar al propio listener.
    const store6 = createStatePulsar({ n: 0 });
    const seen = [];

    store6.subscribeSelector('n', (val) => {
      seen.push(val);
      if (seen.length === 1) {
        // Reentrada: setState desde el callback inmediato
        store6.setState({ n: val + 1 });
      }
    }, { immediate: true });

    assert(seen.length === 2, 'subscribeSelector con immediate: recibe la notificación reentrante desde su primer callback');
    assert(seen[0] === 0 && seen[1] === 1, 'subscribeSelector con immediate: los valores recibidos son [0, 1]');

    section('TEST 7: Desuscripción durante _notify (reentrancy safety)');
    // El contrato dice que _notify usa un snapshot del registro de listeners
    // antes de iterar. Consecuencia doble:
    //   (a) Un listener que desuscribe a otro durante la notificación en curso
    //       NO impide que el otro reciba esa misma notificación (ya en snapshot).
    //   (b) En la SIGUIENTE notificación, el desuscribido ya no aparece.
    // Ambas propiedades deben verificarse.
    const store7 = createStatePulsar({ counter: 0 });
    const calls = { a: 0, b: 0 };
    let unsubB = null;

    const unsubA = store7.subscribe(() => {
      calls.a++;
      if (calls.a === 1 && unsubB) {
        unsubB(); // desuscribir b desde el callback de a
      }
    });

    unsubB = store7.subscribe(() => {
      calls.b++;
    });

    store7.setState({ counter: 1 });
    assert(calls.a === 1 && calls.b === 1,
      'Snapshot preserva iteración: b se llama en la notificación en curso aunque a lo desuscriba');

    store7.setState({ counter: 2 });
    assert(calls.a === 2 && calls.b === 1,
      'En la siguiente notificación, el listener desuscribido ya no se llama');

    unsubA();

    // ============================================================
    // TESTS NUEVOS DEL PUNTO 3 DE FASE 0 (P-T2..P-T5)
    // ============================================================

    section('TEST 8: skipEqualUpdates evita notificaciones redundantes (P-T2)');
    // Con skipEqualUpdates: true, un setState cuyo shallow-merge resulte
    // en un estado con las mismas claves y los mismos valores (por Object.is)
    // NO debe disparar _notify. El listener no ve el "cambio" que no fue.
    const store8 = createStatePulsar({ x: 1, y: 2 }, { skipEqualUpdates: true });
    let notifyCount = 0;
    store8.subscribe(() => { notifyCount++; });

    store8.setState({ x: 1 }); // shallow-merge → { x: 1, y: 2 } — idéntico
    assert(notifyCount === 0, 'skipEqualUpdates: setState con mismo shallow-merge no dispara notificación');

    store8.setState({ x: 3 }); // cambio real
    assert(notifyCount === 1, 'skipEqualUpdates: setState con cambio real sí dispara notificación');

    store8.setState({ x: 3, y: 2 }); // idéntico al estado actual
    assert(notifyCount === 1, 'skipEqualUpdates: setState explícito con mismos valores no re-notifica');

    // Verificar el default: sin skipEqualUpdates, cada setState notifica
    // incluso si el resultado es indistinguible.
    const store8b = createStatePulsar({ x: 1 }); // default: skipEqualUpdates false
    let notifyCountB = 0;
    store8b.subscribe(() => { notifyCountB++; });

    store8b.setState({ x: 1 });
    store8b.setState({ x: 1 });
    assert(notifyCountB === 2, 'Sin skipEqualUpdates: cada setState notifica aunque el estado sea idéntico');

    section('TEST 9: Validación de tipo en createStatePulsar y setState (P-T3)');
    // El contrato exige que initialState y partial sean "objetos planos".
    // Casos que deben lanzar TypeError:
    //   - null
    //   - arrays
    //   - instancias de Date
    //   - instancias de clase custom (prototipo distinto de Object.prototype)

    // 9a: createStatePulsar
    const badInitials = [
      { value: null, label: 'null' },
      { value: [], label: 'array vacío' },
      { value: [1, 2, 3], label: 'array con elementos' },
      { value: new Date(), label: 'instancia de Date' },
      { value: new (class Foo {})(), label: 'instancia de clase custom' },
    ];
    for (const { value, label } of badInitials) {
      let threw = false;
      try {
        createStatePulsar(value);
      } catch (e) {
        threw = e instanceof TypeError;
      }
      assert(threw, `createStatePulsar rechaza ${label} con TypeError`);
    }

    // 9b: setState
    const store9 = createStatePulsar({});
    const badPartials = [
      { value: null, label: 'null' },
      { value: [], label: 'array vacío' },
      { value: new Date(), label: 'instancia de Date' },
      { value: new (class Bar {})(), label: 'instancia de clase custom' },
    ];
    for (const { value, label } of badPartials) {
      let threw = false;
      try {
        store9.setState(value);
      } catch (e) {
        threw = e instanceof TypeError;
      }
      assert(threw, `setState rechaza ${label} con TypeError`);
    }

    // 9c: casos válidos (Object.create(null) es objeto plano según el contrato)
    let didNotThrow = true;
    try {
      const nullProto = Object.create(null);
      nullProto.foo = 1;
      const okStore = createStatePulsar(nullProto);
      okStore.setState({ bar: 2 });
    } catch (e) {
      didNotThrow = false;
    }
    assert(didNotThrow, 'Object.create(null) se acepta como objeto plano válido');

    section('TEST 10: Errores en listeners no interrumpen la notificación (P-T4)');
    // Contrato §5: errores en listeners se capturan y loguean; los demás
    // listeners de la misma notificación se ejecutan igual, y el listener
    // que lanzó NO queda desregistrado — vuelve a ser llamado en el
    // siguiente setState.
    const store10 = createStatePulsar({ n: 0 });
    let boomCallCount = 0;
    let goodCallCount = 0;

    // Silenciar el console.error esperado durante este test para no
    // contaminar la consola del navegador (mismo mecanismo que usaría
    // un runner sensato).
    const originalConsoleError = console.error;
    const capturedErrors = [];
    console.error = (...args) => { capturedErrors.push(args); };

    const unsubBoom = store10.subscribe(() => {
      boomCallCount++;
      throw new Error('boom');
    });
    const unsubGood = store10.subscribe(() => {
      goodCallCount++;
    });

    store10.setState({ n: 1 });
    assert(boomCallCount === 1, 'El listener que lanza es invocado');
    assert(goodCallCount === 1, 'El listener siguiente NO se salta por el error del anterior');
    assert(capturedErrors.length >= 1, 'El error es logueado (no silenciado ni propagado)');

    store10.setState({ n: 2 });
    assert(boomCallCount === 2, 'El listener que lanzó sigue registrado y se invoca en la siguiente notificación');
    assert(goodCallCount === 2, 'El listener bueno también se invoca en la segunda notificación');

    // Restaurar console.error
    console.error = originalConsoleError;

    unsubBoom();
    unsubGood();

    section('TEST 11: equality custom en subscribeSelector (P-T5)');
    // El contrato permite pasar options.equality: (a, b) => boolean.
    // Cuando el selector retorna objetos, la comparación por defecto
    // (Object.is) casi siempre resulta en "distinto" — cada mutación
    // produce referencia nueva. Con equality custom, se puede pedir
    // que el listener solo se llame cuando cambia un campo específico.
    const store11 = createStatePulsar({
      user: { name: 'Alice', age: 30 }
    });

    let listenerCalls = 0;
    let lastReceivedName = null;

    // equality custom: solo consideramos "cambio" si el name difiere
    const byName = (a, b) => {
      if (!a || !b) return a === b;
      return a.name === b.name;
    };

    store11.subscribeSelector(
      (state) => state.user,
      (current) => {
        listenerCalls++;
        lastReceivedName = current?.name;
      },
      { equality: byName, immediate: true }
    );

    // immediate: true dispara la primera invocación
    assert(listenerCalls === 1, 'equality custom: immediate dispara la primera invocación');
    assert(lastReceivedName === 'Alice', 'equality custom: valor inicial correcto');

    // Cambiar age (name igual) → equality dice "iguales" → NO invoca
    store11.setState({ user: { name: 'Alice', age: 31 } });
    assert(listenerCalls === 1, 'equality custom: cambio de campo no relevante no dispara');
    assert(lastReceivedName === 'Alice', 'equality custom: el valor recibido sigue siendo Alice');

    // Cambiar name → equality dice "distintos" → invoca
    store11.setState({ user: { name: 'Bob', age: 31 } });
    assert(listenerCalls === 2, 'equality custom: cambio de campo relevante dispara');
    assert(lastReceivedName === 'Bob', 'equality custom: valor recibido actualizado a Bob');

    // Volver a cambiar age (name igual) → sigue sin disparar
    store11.setState({ user: { name: 'Bob', age: 32 } });
    assert(listenerCalls === 2, 'equality custom: nuevo cambio irrelevante tampoco dispara');

    section('TEST 12: equality por defecto compara por identidad (control)');
    // Contraparte de TEST 11: sin equality custom, un selector que
    // retorna el objeto entero notifica en cada setState, porque cada
    // shallow-merge produce un objeto raíz nuevo (y el sub-objeto
    // también, si se pasó reemplazado).
    const store12 = createStatePulsar({ user: { name: 'Alice' } });
    let defaultCalls = 0;

    store12.subscribeSelector(
      (state) => state.user,
      () => { defaultCalls++; },
      { immediate: true }
    );

    assert(defaultCalls === 1, 'equality por defecto: immediate dispara la primera invocación');

    store12.setState({ user: { name: 'Alice' } }); // objeto nuevo, misma forma
    assert(defaultCalls === 2, 'equality por defecto (Object.is): un objeto con misma forma pero referencia nueva dispara');

    // ============================================================
    // Resumen final
    // ============================================================
    const total = passed + failed;
    const summary = document.createElement('div');
    summary.style.marginTop = '30px';
    summary.style.fontSize = '1.1em';
    summary.style.fontWeight = 'bold';
    summary.style.padding = '10px';
    summary.style.borderTop = '2px solid #555';
    summary.innerHTML = `📊 Resultados: ${passed}/${total} pasaron. ${failed === 0 ? '🎉 ¡Todos los tests del contrato pasaron!' : `⚠️ ${failed} fallo(s). Revisa arriba.`}`;
    output.appendChild(summary);

    if (failed === 0) {
      document.body.style.background = '#1e3a2a';
    } else {
      document.body.style.background = '#3a1e1e';
    }
  </script>
</body>
</html>
