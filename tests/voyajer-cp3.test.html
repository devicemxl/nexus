<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Voyajer CP3 - Historial</title>
</head>
<body>
  <h1>Voyajer CP3 - Historial y Navegación</h1>
  <p>Estado actual: <span id="routeDisplay">(cargando...)</span></p>
  <nav>
    <a href="#/">Inicio</a>
    <a href="#/users">Usuarios</a>
    <a href="#/users/123">Usuario 123</a>
    <a href="#/about">Acerca de</a>
  </nav>
  <div>
    <button id="backBtn">⬅ Atrás</button>
    <button id="forwardBtn">Adelante ➡</button>
    <button id="goBack2">⬅⬅ Retroceder 2</button>
    <button id="goForward1">➡ Avanzar 1</button>
  </div>

  <script type="module">
    import { createStatePulsar } from '../src/pulsar.js';
    import { createVoyajer } from '../src/voyajer.js';

    // Nota (v0.2.1): parse recibe la URL virtual con hash promovido a
    // pathname. Ver spec §5.4.
    const store = createStatePulsar({});
    const voyajer = createVoyajer(store, {
      mode: 'hash',
      parse: (url) => ({
        path: url.pathname,
        search: url.search,
        hash: url.hash,
      }),
      serialize: (state) => state.path + (state.search || '') + (state.hash || ''),
    });

    const display = document.getElementById('routeDisplay');
    store.subscribeSelector('route', (route) => {
      display.textContent = route ? JSON.stringify(route, null, 2) : '(vacío)';
      console.log('Route actual:', route);
    }, { immediate: true });

    document.getElementById('backBtn').addEventListener('click', () => voyajer.back());
    document.getElementById('forwardBtn').addEventListener('click', () => voyajer.forward());
    document.getElementById('goBack2').addEventListener('click', () => voyajer.go(-2));
    document.getElementById('goForward1').addEventListener('click', () => voyajer.go(1));

    console.log('Voyajer CP3 listo. Navega con los enlaces o los botones.');
  </script>
</body>
</html>
