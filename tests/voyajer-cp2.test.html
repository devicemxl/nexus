<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Voyajer CP2 - Navegación Programática</title>
</head>
<body>
  <h1>Voyajer CP2 - Navegación Programática</h1>
  <p>Estado actual: <span id="routeDisplay">(cargando...)</span></p>
  <button id="goHome">Ir a Inicio</button>
  <button id="goUsers">Ir a Usuarios</button>
  <button id="goUser123">Ir a Usuario 123</button>
  <button id="goReplace">Reemplazar con About</button>
  <button id="goCustom">Ir a Custom /test/hello?q=123</button>
  <button id="goSame">Push repetido (idempotente)</button>

  <script type="module">
    import { createStatePulsar } from '../src/pulsar.js';
    import { createVoyajer } from '../src/voyajer.js';

    // Nota (v0.2.1): en modo 'hash', Voyajer normaliza la URL antes
    // de pasarla al parse. Un enlace #/foo?bar=1 llega al parse como
    // { pathname: '/foo', search: '?bar=1' }.
    const store = createStatePulsar({});
    const voyajer = createVoyajer(store, {
      mode: 'hash',
      parse: (url) => ({
        path: url.pathname,
        search: url.search,
        hash: url.hash,
      }),
      serialize: (state) => {
        if (state.path === undefined) return '/';
        return state.path + (state.search || '') + (state.hash || '');
      },
    });

    // Mostrar estado en la UI
    const display = document.getElementById('routeDisplay');
    store.subscribeSelector('route', (route) => {
      display.textContent = route ? JSON.stringify(route, null, 2) : '(vacío)';
      console.log('Route actual:', route);
    }, { immediate: true });

    // Botones de navegación
    document.getElementById('goHome').addEventListener('click', () => {
      voyajer.push({ path: '/' });
    });

    document.getElementById('goUsers').addEventListener('click', () => {
      voyajer.push({ path: '/users' });
    });

    document.getElementById('goUser123').addEventListener('click', () => {
      voyajer.push({ path: '/users/123' });
    });

    document.getElementById('goReplace').addEventListener('click', () => {
      voyajer.replace({ path: '/about' });
    });

    document.getElementById('goCustom').addEventListener('click', () => {
      voyajer.push({ path: '/test/hello', search: '?q=123' });
    });

    // Demostración de idempotencia (v0.2.1): dos pushes al mismo path
    // solo generan una entrada en el history.
    document.getElementById('goSame').addEventListener('click', () => {
      const before = window.history.length;
      voyajer.push({ path: '/users' });
      voyajer.push({ path: '/users' });
      const after = window.history.length;
      console.log(`Historial antes: ${before}, después: ${after} (diff = ${after - before})`);
    });

    // Botón para mostrar historial
    const historyBtn = document.createElement('button');
    historyBtn.textContent = 'Mostrar historial';
    historyBtn.addEventListener('click', () => {
      console.log('Historial actual:', window.history);
      console.log('Longitud:', window.history.length);
    });
    document.body.appendChild(historyBtn);

    console.log('Voyajer CP2 listo.');
  </script>
</body>
</html>
