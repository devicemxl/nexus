<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>ChunkletJS – Demo Fase 3 (setup + define + ctx listo)</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }

    .success {
      color: #4ec9b0;
    }

    .error {
      color: #f44747;
    }

    .info {
      color: #dcdcaa;
    }

    #output {
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <h1>🧪 ChunkletJS Demo – Fase 3</h1>
  <div id="output"></div>

  <script type="module">
    import * as Chunklet from '../src/chunklet.js';

    // Exponer para pruebas manuales en consola
    window.Chunklet = Chunklet;

    const output = document.getElementById('output');

    function log(msg, className = 'info') {
      const div = document.createElement('div');
      div.className = className;
      div.textContent = msg;
      output.appendChild(div);
    }

    try {
      // ========== 1. SETUP ==========
      log('=== 1. Setup ===', 'info');
      const stack = Chunklet.setup({
        pulsar: {
          initialState: {
            ui: { theme: 'dark' },
            enabled: {}
          }
        },
        graphlet: undefined,
        voyajer: { mode: 'hash' },
        entityAttr: 'data-entity',
        enabledPath: 'ui.enabled'
      });

      // Verificar stack
      if (typeof stack.pulsar.getState === 'function') {
        log('✅ pulsar instancia válida', 'success');
      } else {
        throw new Error('pulsar no válido');
      }

      if (typeof stack.graphlet.allIds === 'function') {
        log('✅ graphlet instancia válida', 'success');
      } else {
        throw new Error('graphlet no válido');
      }

      if (stack.voyajer && typeof stack.voyajer.getCurrent === 'function') {
        log('✅ voyajer instancia válida', 'success');
      } else {
        throw new Error('voyajer no válido');
      }

      // Estado inicial
      const state = stack.pulsar.getState();
      log(`✅ Estado inicial: ui=${JSON.stringify(state.ui)}`, 'success');

      // Graphlet
      stack.graphlet.put('node:1', { title: 'Hola Chunklet' });
      const entity = stack.graphlet.get('node:1');
      if (entity && entity.properties.title === 'Hola Chunklet') {
        log(`✅ Graphlet entidad node:1 → "${entity.properties.title}"`, 'success');
      } else {
        throw new Error('Graphlet falla');
      }

      // ========== 2. DEFINE ==========
      log('=== 2. Define ===', 'info');

      // Registrar comportamiento normal
      Chunklet.define('saludar', (element, ctx) => {
        // El ctx estará disponible cuando montemos en Fase 4
        console.log('Comportamiento "saludar" definido. ctx disponible en mount:', ctx);
      });
      log('✅ define("saludar") registrado', 'success');

      // Sobreescritura
      Chunklet.define('saludar', (element, ctx) => {
        console.log('Versión sobreescrita de "saludar"');
      });
      log('✅ define("saludar") sobreescrito', 'success');

      // Errores esperados
      try {
        Chunklet.define('', () => { });
        log('❌ define("") debería lanzar', 'error');
      } catch (e) {
        log(`✅ Error correcto: ${e.message}`, 'success');
      }

      try {
        Chunklet.define('con espacio', () => { });
        log('❌ define("con espacio") debería lanzar', 'error');
      } catch (e) {
        log(`✅ Error correcto: ${e.message}`, 'success');
      }

      try {
        Chunklet.define('demo', null);
        log('❌ define("demo", null) debería lanzar', 'error');
      } catch (e) {
        log(`✅ Error correcto: ${e.message}`, 'success');
      }

      // ========== 3. VERIFICACIÓN INDIRECTA DE FASE 3 ==========
      log('=== 3. Verificación de _createContext ===', 'info');
      log('ℹ️ _createContext es privado, pero el módulo carga sin errores.', 'info');
      log('ℹ️ Cuando implementemos mount (Fase 4), cada factory recibirá su ctx real.', 'info');

      // Comprobamos que el objeto exportado tiene las funciones esperadas
      const publicApi = Object.keys(Chunklet).sort();
      log(`🔧 API pública actual: ${publicApi.join(', ')}`, 'success');

      // ========== 4. RESUMEN ==========
      log('=== Resumen ===', 'info');
      log('✅ Fases 1 y 2 completadas. Fase 3 preparada para mount.', 'success');
    } catch (error) {
      log(`❌ Error inesperado: ${error.message}`, 'error');
      console.error(error);
    }
    // ========== 4. PRUEBA REAL DE MOUNT ==========
    log('=== 4. Probando mount() ===', 'info');

    // Registrar un comportamiento que use ctx completamente.
    Chunklet.define('ctx-demo', (element, ctx) => {
      element.style.border = '2px solid #4ec9b0';
      element.textContent = '✅ Comportamiento activo';

      // Suscribirse sin pasar store (firma nueva).
      ctx.subscribeSelector('ui.count', (count) => {
        element.setAttribute('data-count', count);
      }, { immediate: true });

      // Registrar listener con auto-cleanup.
      ctx.listen(element, 'click', () => {
        const ui = { ...ctx.getState().ui, count: (ctx.getState().ui.count || 0) + 1 };
        ctx.setState({ ui });
      });

      // Cleanup manual.
      ctx.cleanup(() => {
        console.log('ctx-demo destruido');
      });
    });

    // Crear un elemento con data-chunk.
    const demoDiv = document.createElement('div');
    demoDiv.id = 'demo-mount';
    demoDiv.setAttribute('data-chunk', 'ctx-demo demo-inexistente');
    demoDiv.style.padding = '20px';
    demoDiv.style.margin = '10px 0';
    demoDiv.style.background = '#2d2d2d';
    document.body.appendChild(demoDiv);

    // Montar todos los data-chunk dentro del body.
    Chunklet.mount(document.body);

    // Verificar que el ctx funcionó (la suscripción inmediata debió ejecutarse).
    const countValue = demoDiv.getAttribute('data-count');
    if (countValue !== null) {
      log(`✅ ctx-demo montado y selector inmediato recibió valor: ${countValue}`, 'success');
    } else {
      log('❌ La suscripción inmediata no se ejecutó', 'error');
    }

    // Simular un click para probar el listener.
    demoDiv.click();
    const countAfterClick = demoDiv.getAttribute('data-count');
    if (countAfterClick === '1') {
      log('✅ Click funcionó: ctx.setState actualizó ui.count a 1', 'success');
    } else {
      log(`❌ Click no actualizó correctamente (valor=${countAfterClick})`, 'error');
    }
  </script>
</body>

</html>
