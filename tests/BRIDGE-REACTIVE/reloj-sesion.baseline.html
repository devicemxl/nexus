<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fase 0 — línea base del testigo (BRIDGE-REACTIVE)</title>
<style>
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 2rem; max-width: 60rem; }
  h1 { font-size: 1.1rem; }
  h2 { font-size: 1rem; margin-top: 2rem; }
  table { border-collapse: collapse; margin: 1rem 0; }
  th, td { border: 1px solid #ccc; padding: .3rem .6rem; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  .nota { color: #555; }
  .cifra { font-weight: bold; }
  #reloj { display: inline-block; min-width: 3ch; }
</style>
</head>
<body>

<h1>Fase 0 — línea base del testigo</h1>
<p class="nota">
  Esta página <strong>declara</strong> el punto de partida. No afirma nada todavía:
  no hay aserciones, sólo cifras. Las aserciones son la Fase 1.
</p>

<!-- El testigo se monta como cualquier otro behavior. ANDAMIO: se retira
     de una pieza al cerrar la Fase 4. -->
<div id="cabecera" data-chunk="reloj-sesion" data-modo="medicion">
  sesión: <span id="reloj" data-reloj></span> s
</div>

<div id="salida"></div>

<script type="module">
import { createNebula } from '../../src/nebula.js';
import { createStatePulsar } from '../../src/pulsar.js';
import * as Chunklet from '../../src/chunklet.js';
import { createNebulaPulsarBridge } from '../../src/adapters/nebula-pulsar-bridge.js';
import { relojSesionFactory, NOMBRE } from './reloj-sesion.js';

const TOKENS = 100;
const salida = document.getElementById('salida');

function seccion(titulo) {
  const h = document.createElement('h2');
  h.textContent = titulo;
  salida.appendChild(h);
}
function linea(texto) {
  const p = document.createElement('p');
  p.innerHTML = texto;
  salida.appendChild(p);
}
function tabla(cabeceras, filas) {
  const t = document.createElement('table');
  t.innerHTML =
    '<tr>' + cabeceras.map(c => `<th>${c}</th>`).join('') + '</tr>' +
    filas.map(f => '<tr>' + f.map(c => `<td>${c}</td>`).join('') + '</tr>').join('');
  salida.appendChild(t);
}

// ---------------------------------------------------------------------------
// Stack. Orden canónico de la Escena 1.1: grafo poblado ANTES de montar el
// Bridge. Aquí no hay hidratación, pero el orden se respeta igual.
// ---------------------------------------------------------------------------
const nebula = createNebula();
const pulsar = createStatePulsar({ ui: {}, entities: {} });

const ahora = Date.now();
nebula.upsert('conversation:A', { titulo: 'A', creadaEn: ahora - 42000 });
nebula.upsert('conversation:B', { titulo: 'B', creadaEn: ahora - 9000 });
nebula.upsert('message:a1', { texto: '', estado: 'en-vuelo', creadoEn: ahora });
nebula.link('conversation:A', 'contiene', 'message:a1');

const bridge = createNebulaPulsarBridge({ nebula, pulsar }, { path: 'entities' });

Chunklet.setup({ pulsar, nebula });
Chunklet.define(NOMBRE, relojSesionFactory);

// B es la conversación activa. El reloj mira a B y nunca debería despertarse
// por lo que ocurra dentro de A.
pulsar.setState({ ui: { ...pulsar.getState().ui, activeConversation: 'conversation:B' } });

Chunklet.mount(document.getElementById('cabecera'));

const instrumento = document.getElementById('cabecera').__instrumento;

// ---------------------------------------------------------------------------
// 1. El testigo está montado y mide
// ---------------------------------------------------------------------------
seccion('1. Testigo montado');
linea(`modo: <strong>${instrumento.modo}</strong> — el intervalo no arranca, así que ningún repintado es propio del reloj.`);
linea(`Invocaciones tras el montaje (la suscripción inmediata cuenta una): <span class="cifra">${instrumento.invocaciones}</span>`);
linea(`Valor visible del reloj: <strong>${document.getElementById('reloj').textContent} s</strong> — los segundos desde que se creó B.`);

// ---------------------------------------------------------------------------
// 2. El desperdicio conocido, a la vista
// ---------------------------------------------------------------------------
seccion('2. Línea base: streaming en A con B activa');

instrumento.reiniciar();
const visiblePrevio = document.getElementById('reloj').textContent;

for (let t = 0; t < TOKENS; t++) {
  nebula.update('message:a1', { texto: 'x'.repeat(t) });
}

const visiblePosterior = document.getElementById('reloj').textContent;

linea(`${TOKENS} tokens escritos en un mensaje de <strong>A</strong>, con <strong>B</strong> activa.`);
tabla(
  ['magnitud', 'valor'],
  [
    ['invocaciones de la suscripción del reloj', `<span class="cifra">${instrumento.invocaciones}</span>`],
    ['repintados (el texto visible cambió)', instrumento.repintados],
    ['valor visible antes', `${visiblePrevio} s`],
    ['valor visible después', `${visiblePosterior} s`],
  ]
);
linea(
  instrumento.invocaciones >= TOKENS
    ? 'El reloj de <strong>B</strong> despertó una vez por token de <strong>A</strong>, sin que su valor cambiara. Es el desperdicio ya conocido, ahora observable.'
    : 'Cifra inesperada: revisar los acoplamientos declarados en <code>reloj-sesion.js</code> antes de seguir.'
);

// ---------------------------------------------------------------------------
// 3. El complementario, para que la cifra signifique algo
// ---------------------------------------------------------------------------
seccion('3. Control: streaming en A con A activa');

pulsar.setState({ ui: { ...pulsar.getState().ui, activeConversation: 'conversation:A' } });
instrumento.reiniciar();

for (let t = 0; t < TOKENS; t++) {
  nebula.update('message:a1', { texto: 'y'.repeat(t) });
}

tabla(
  ['magnitud', 'valor'],
  [['invocaciones de la suscripción del reloj', `<span class="cifra">${instrumento.invocaciones}</span>`]]
);
linea(
  'Con <strong>A</strong> activa el reloj mira la entidad <code>conversation:A</code>, que tampoco cambia: los tokens van al mensaje, no a la conversación. ' +
  'Que esta cifra también suba confirma que lo que despierta al reloj es la reproyección completa, no un cambio real de su entidad. ' +
  'Es la observación que hace falta para que la Fase 2 no se dé por buena con un Bridge que simplemente deje de notificar.'
);

seccion('Estado');
linea('Línea base declarada. Nada afirmado todavía — las aserciones son la Fase 1.');
</script>

</body>
</html>
