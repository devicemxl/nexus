<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Binder CP2 - Binding de Campos</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    label { display: block; margin: 10px 0; }
    input, select { display: block; padding: 5px; }
    .pass { color: #4ec9b0; }
    .fail { color: #f44747; }
  </style>
</head>
<body>
  <h1>Binder CP2 - Binding de Campos</h1>
  
  <form id="testForm">
    <label>
      Nombre:
      <input type="text" name="user.name" data-bind="user.name" value="Inicial">
    </label>
    <label>
      Edad:
      <input type="number" name="user.age" data-bind="user.age" value="25">
    </label>
    <label>
      Activo:
      <input type="checkbox" name="user.active" data-bind="user.active">
    </label>
    <label>
      Rol:
      <select name="user.role" data-bind="user.role">
        <option value="admin">Admin</option>
        <option value="user">User</option>
        <option value="guest">Guest</option>
      </select>
    </label>
  </form>

  <div id="output"></div>

  <script type="module">
    import { createStatePulsar } from '../src/pulsar.js';
    import { createBinder } from '../src/binder.js';

    const store = createStatePulsar({
      form: {
        user: {
          name: 'Alice',
          age: 30,
          active: true,
          role: 'admin'
        }
      }
    });

    const binder = createBinder(store, { key: 'form' });

    // Vincular el formulario
    binder.bind('#testForm');

    const output = document.getElementById('output');

    // Verificar que los valores iniciales se reflejan en el DOM
    const nameInput = document.querySelector('[name="user.name"]');
    const ageInput = document.querySelector('[name="user.age"]');
    const activeCheck = document.querySelector('[name="user.active"]');
    const roleSelect = document.querySelector('[name="user.role"]');

    function assert(condition, message) {
      const div = document.createElement('div');
      div.textContent = condition ? `✅ ${message}` : `❌ ${message}`;
      div.style.color = condition ? '#4ec9b0' : '#f44747';
      output.appendChild(div);
      console.assert(condition, message);
    }

    assert(nameInput.value === 'Alice', 'El input nombre se inicializa con "Alice"');
    assert(ageInput.value === '30', 'El input edad se inicializa con "30"');
    assert(activeCheck.checked === true, 'El checkbox activo se inicializa como true');
    assert(roleSelect.value === 'admin', 'El select rol se inicializa con "admin"');

    // Cambiar el store externamente
    store.setState({
      form: {
        user: {
          name: 'Bob',
          age: 35,
          active: false,
          role: 'user'
        }
      }
    });

    assert(nameInput.value === 'Bob', 'El DOM se actualiza cuando el store cambia (nombre: Bob)');
    assert(ageInput.value === '35', 'El DOM se actualiza cuando el store cambia (edad: 35)');
    assert(activeCheck.checked === false, 'El DOM se actualiza cuando el store cambia (activo: false)');
    assert(roleSelect.value === 'user', 'El DOM se actualiza cuando el store cambia (rol: user)');

    // Cambiar el DOM manualmente (simular input)
    nameInput.value = 'Charlie';
    nameInput.dispatchEvent(new Event('input', { bubbles: true }));

    assert(store.getState().form.user.name === 'Charlie', 'El store se actualiza cuando el DOM cambia (nombre: Charlie)');

    // Probar unbind
    binder.unbind('#testForm');
    // Ahora cambiar el store no debería afectar al DOM
    store.setState({
      form: {
        user: {
          name: 'Dave',
          age: 40,
          active: true,
          role: 'guest'
        }
      }
    });

    assert(nameInput.value === 'Charlie', 'Después de unbind, el DOM no se actualiza (nombre sigue siendo Charlie)');

    console.log('✅ CP2 completado');
  </script>
</body>
</html>
