<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chunklet CP1 - Prueba básica</title>
</head>
<body>
  <h1>Chunklet CP1</h1>
  <div id="app">
    <div data-chunk="saludador contador">Elemento</div>
  </div>
  <button id="unmountBtn">Desmontar</button>
  <button id="mountBtn">Montar de nuevo</button>

  <script type="module">
    import { define, mount, unmount } from '../src/chunklet.js';

    // Definir comportamiento "saludador"
    define('saludador', (el, ctx) => {
      console.log('🟢 saludador montado en', el);
      el.style.border = '2px solid blue';
      return {
        destroy: () => {
          console.log('🔴 saludador desmontado');
          el.style.border = '';
        }
      };
    });

    // Definir comportamiento "contador"
    define('contador', (el, ctx) => {
      let count = 0;
      console.log('🟢 contador montado en', el);
      const span = document.createElement('span');
      span.textContent = '0';
      el.appendChild(span);

      // Simulamos un listener (sin contexto, solo para probar)
      const handler = () => {
        count++;
        span.textContent = count;
      };
      el.addEventListener('click', handler);

      return {
        destroy: () => {
          console.log('🔴 contador desmontado');
          el.removeEventListener('click', handler);
          span.remove();
        }
      };
    });

    const app = document.getElementById('app');
    mount(app);

    document.getElementById('unmountBtn').addEventListener('click', () => {
      unmount(app);
    });

    document.getElementById('mountBtn').addEventListener('click', () => {
      mount(app);
    });
  </script>
</body>
</html>
