<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Graphlet CP4 - Links</title>
</head>
<body>
  <script type="module">
    import { createGraphlet } from '../src/graphlet.js';

    const g = createGraphlet();

    // Crear entidades
    g.put('user:1', { name: 'Alice' });
    g.put('user:2', { name: 'Bob' });
    g.put('project:1', { title: 'Nexus' });

    // ---- link ----
    g.link('user:1', 'memberOf', 'project:1');
    g.link('user:2', 'memberOf', 'project:1');
    g.link('project:1', 'hasMember', 'user:1');
    g.link('project:1', 'hasMember', 'user:2');

    console.log('Después de link:');
    console.log('user:1 ->', g.get('user:1'));
    console.log('project:1 ->', g.get('project:1'));

    // ---- unlink (eliminar una relación) ----
    g.unlink('project:1', 'hasMember', 'user:1');
    console.log('Después de unlink project:1 hasMember user:1');
    console.log('project:1 ->', g.get('project:1')); // hasMember solo ['user:2']

    // ---- unlinkAll ----
    g.unlinkAll('user:1', 'memberOf');
    console.log('Después de unlinkAll user:1 memberOf');
    console.log('user:1 ->', g.get('user:1')); // links vacío

    // ---- Verificar que unlink en source inexistente es no-op ----
    g.unlink('user:99', 'memberOf', 'project:1'); // no debe lanzar error
    console.log('unlink sobre source inexistente: OK (no-op)');

    // ---- Verificar que link lanza error si source no existe ----
    try {
      g.link('user:99', 'memberOf', 'project:1');
    } catch(e) {
      console.log('Error esperado (source inexistente):', e.message);
    }

    console.log('✅ CP4 completado');
  </script>
</body>
</html>
