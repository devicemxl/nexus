<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>VoyajerJS - Tests de Contrato v0.2.1</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    .pass { color: #4ec9b0; }
    .fail { color: #f44747; }
    .test { padding: 4px 0; border-bottom: 1px solid #333; }
    .summary { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🧪 VoyajerJS Contract Tests v0.2.1</h1>
  <div id="output"></div>

  <script type="module">
    import { createStatePulsar } from '../src/pulsar.js';
    import { createVoyajer } from '../src/voyajer.js';

    // ============================================
    // DEFENSA CONTRA BACK-FORWARD CACHE (bfcache)
    // ============================================
    //
    // El bfcache del navegador suspende la página viva (JS ejecutado,
    // estado, listeners) al navegar hacia atrás/adelante y la reanuda
    // sin re-ejecutar el script. Esto es útil en aplicaciones reales
    // pero rompe un harness de test que asume estado limpio en cada run.
    //
    // Doble defensa:
    //   1. Si el navegador restauró la página desde bfcache (event.persisted
    //      es true), forzar recarga fresca. Esto elimina listeners viejos,
    //      timers activos y cualquier instancia de Voyajer del run anterior.
    //   2. Neutralizar cualquier hash residual ANTES de crear Voyajers.
    //      Un hash sobreviviente de un run anterior (o de una URL abierta
    //      con hash arbitrario) contamina el primer test de CP1, que lee
    //      la URL con writeOnInit=true.
    //
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        window.location.reload();
      }
    });

    if (window.location.hash && window.location.hash !== '#/') {
      window.history.replaceState(null, '', window.location.pathname + '#/');
    }

    // Guardamos el path original ANTES de que ningún test toque history.
    // El cleanup final lo restaurará (importante para tests de modo history
    // que cambian el pathname del browser via pushState).
    const ORIGINAL_PATHNAME = window.location.pathname;
    const ORIGINAL_SEARCH = window.location.search;

    const output = document.getElementById('output');
    let passed = 0;
    let failed = 0;

    function assert(condition, message) {
      const div = document.createElement('div');
      div.className = 'test';
      if (condition) {
        div.innerHTML = `✅ <span class="pass">${message}</span>`;
        passed++;
      } else {
        div.innerHTML = `❌ <span class="fail">${message}</span>`;
        failed++;
      }
      output.appendChild(div);
      console.assert(condition, message);
    }

    function log(message, type = 'info') {
      const div = document.createElement('div');
      div.className = 'test';
      div.innerHTML = `ℹ️ <span class="${type}">${message}</span>`;
      output.appendChild(div);
    }

    // ============================================
    // TIMING DIRIGIDO POR EVENTOS (V-T0)
    // ============================================
    //
    // Reemplaza los antiguos `delay(200-300)` fijos por una espera que
    // resuelve en cuanto el store refleja el estado esperado. Esta forma
    // tiene tres ventajas sobre el reloj:
    //   1. Es rápida en el caso feliz (microtasks, no ms).
    //   2. En CI cargado no falla por flakiness: el timeout de rescate
    //      solo dispara ante un bug real.
    //   3. Al eliminar los `sync()` manuales que compensaban timing,
    //      los tests de back/forward/go prueban de verdad que
    //      `hashchange` reactiva a Voyajer. Si el listener no dispara,
    //      el test falla por timeout, no por comparación silenciosa.
    //
    // El timeout por defecto (1000ms) actúa como cap de rescate para no
    // colgar el runner ante un bug que impida el evento.
    //
    function waitForRoute(store, predicate, timeoutMs = 1000, label = '') {
      return new Promise((resolve, reject) => {
        // Si ya está en el estado esperado, resolver inmediatamente.
        const currentRoute = store.getState().route;
        if (predicate(currentRoute)) {
          resolve(currentRoute);
          return;
        }

        let timeoutId;
        const unsubscribe = store.subscribeSelector('route', (route) => {
          if (predicate(route)) {
            clearTimeout(timeoutId);
            unsubscribe();
            resolve(route);
          }
        });

        timeoutId = setTimeout(() => {
          unsubscribe();
          const suffix = label ? ` (${label})` : '';
          reject(new Error(`Timeout esperando ruta después de ${timeoutMs}ms${suffix}`));
        }, timeoutMs);
      });
    }

    // Helper conveniente para el caso más frecuente: esperar a que
    // route.path llegue a un valor específico.
    function waitForPath(store, expectedPath, timeoutMs = 1000) {
      return waitForRoute(
        store,
        (route) => route && route.path === expectedPath,
        timeoutMs,
        `path=${expectedPath}`
      );
    }

    // ============================================
    // Nota sobre el modelo de URL virtual (v0.2.1):
    // En modo 'hash', Voyajer promueve el contenido del hash a
    // pathname antes de pasar la URL al parse. Por eso los parses
    // de estos tests usan url.pathname en lugar de url.hash.slice(1),
    // aunque el modo sea 'hash'. Ver spec §5.4.
    // ============================================

    // -------- CP1: URL → Store --------
    log('=== CP1: URL → Store ===', 'info');

    const store1 = createStatePulsar({});
    const voyajer1 = createVoyajer(store1, {
      mode: 'hash',
      parse: (url) => ({ path: url.pathname }),
      serialize: (state) => state.path,
      writeOnInit: true,
    });

    // writeOnInit es síncrono en el constructor, no requiere espera.
    const route1 = store1.getState().route;
    assert(route1 !== undefined && route1 !== null, 'writeOnInit: el store tiene el estado inicial');
    assert(route1.path !== undefined, 'writeOnInit: el estado contiene la ruta');

    const store2 = createStatePulsar({});
    const voyajer2 = createVoyajer(store2, {
      mode: 'hash',
      parse: (url) => ({ path: url.pathname }),
      serialize: (state) => state.path,
      writeOnInit: false,
    });

    let route2 = store2.getState().route;
    assert(route2 === undefined, 'writeOnInit: false → store vacío');

    voyajer2.sync();
    route2 = store2.getState().route;
    assert(route2 !== undefined && route2.path !== undefined, 'sync() escribe el estado en el store');

    // -------- CP2: push / replace --------
    log('=== CP2: Store → URL (push/replace) ===', 'info');

    const store3 = createStatePulsar({});
    const voyajer3 = createVoyajer(store3, {
      mode: 'hash',
      parse: (url) => ({ path: url.pathname }),
      serialize: (state) => state.path,
      writeOnInit: false,
    });

    // push es síncrono: escribe al store dentro del método.
    // No requiere espera; el assert puede leer inmediatamente.
    voyajer3.push({ path: '/test-push' });
    const route3 = store3.getState().route;
    assert(route3.path === '/test-push', 'push: la URL cambia y el store se actualiza');
    assert(window.location.hash === '#/test-push', 'push: la URL del navegador se actualiza');

    const store4 = createStatePulsar({});
    const voyajer4 = createVoyajer(store4, {
      mode: 'hash',
      parse: (url) => ({ path: url.pathname }),
      serialize: (state) => state.path,
      writeOnInit: false,
    });

    voyajer4.push({ path: '/first' });
    voyajer4.replace({ path: '/replaced' });

    const route4 = store4.getState().route;
    assert(route4.path === '/replaced', 'replace: el store se actualiza correctamente');
    assert(window.location.hash === '#/replaced', 'replace: la URL se reemplaza');

    // -------- CP3: back/forward/go --------
    // Estos tests NO llaman voyajer.sync() manualmente. La actualización
    // del store depende de que Voyajer reaccione al evento `hashchange`
    // del navegador. Si el listener interno no dispara, el test falla
    // por timeout — comportamiento correcto y detectable.
    //
    // NOTA (V-T4): esta política de "sin sync manual" es exactamente
    // lo que V-T4 requería verificar. Al eliminar los sync() de este
    // grupo, CP3 ya prueba de facto que hashchange reactiva a Voyajer.
    // No hay TEST separado para V-T4 porque su propiedad está
    // implícitamente cubierta aquí.
    log('=== CP3: Historial (back/forward/go) ===', 'info');

    // Test: back y forward
    const store5 = createStatePulsar({});
    const voyajer5 = createVoyajer(store5, {
      mode: 'hash',
      parse: (url) => ({ path: url.pathname }),
      serialize: (state) => state.path,
      writeOnInit: false,
    });

    voyajer5.push({ path: '/home' });
    voyajer5.push({ path: '/about' });
    voyajer5.push({ path: '/contact' });

    voyajer5.back();
    try {
      await waitForPath(store5, '/about');
      assert(store5.getState().route.path === '/about', 'back: navega a la entrada anterior');
      assert(window.location.hash === '#/about', 'back: la URL cambia a #/about');
    } catch (e) {
      assert(false, `back: timeout esperando /about (${e.message})`);
    }

    voyajer5.forward();
    try {
      await waitForPath(store5, '/contact');
      assert(store5.getState().route.path === '/contact', 'forward: navega a la siguiente entrada');
      assert(window.location.hash === '#/contact', 'forward: la URL cambia a #/contact');
    } catch (e) {
      assert(false, `forward: timeout esperando /contact (${e.message})`);
    }

    // Test: go(delta)
    const store6 = createStatePulsar({});
    const voyajer6 = createVoyajer(store6, {
      mode: 'hash',
      parse: (url) => ({ path: url.pathname }),
      serialize: (state) => state.path,
      writeOnInit: false,
    });

    voyajer6.push({ path: '/a' });
    voyajer6.push({ path: '/b' });
    voyajer6.push({ path: '/c' });
    voyajer6.push({ path: '/d' });

    voyajer6.go(-2);
    try {
      await waitForPath(store6, '/b');
      assert(store6.getState().route.path === '/b', 'go(-2): retrocede 2 entradas');
      assert(window.location.hash === '#/b', 'go(-2): la URL cambia a #/b');
    } catch (e) {
      assert(false, `go(-2): timeout esperando /b (${e.message})`);
    }

    voyajer6.go(1);
    try {
      await waitForPath(store6, '/c');
      assert(store6.getState().route.path === '/c', 'go(1): avanza 1 entrada');
      assert(window.location.hash === '#/c', 'go(1): la URL cambia a #/c');
    } catch (e) {
      assert(false, `go(1): timeout esperando /c (${e.message})`);
    }

    // -------- Casos límite --------
    log('=== Casos límite y errores ===', 'info');

    // Test: push con state inválido
    const store7 = createStatePulsar({});
    const voyajer7 = createVoyajer(store7, {
      mode: 'hash',
      parse: (url) => ({ path: url.pathname }),
      serialize: (state) => state.path,
    });

    let threw = false;
    try {
      voyajer7.push(null);
    } catch (e) {
      threw = true;
      assert(e.message.includes('state debe ser un objeto'), 'push lanza TypeError con state null');
    }
    assert(threw, 'push valida que state sea objeto');

    // Test: serialize retorna null
    // push con serialize→null es no-op síncrono: no escribe al store.
    // Verificamos comparando el estado antes y después inmediatamente.
    const store8 = createStatePulsar({});
    const voyajer8 = createVoyajer(store8, {
      mode: 'hash',
      parse: (url) => ({ path: url.pathname }),
      serialize: () => null,
      writeOnInit: false,
    });

    const routeBefore = store8.getState().route || null;
    voyajer8.push({ path: '/anything' });
    const routeAfter = store8.getState().route || null;
    assert(routeBefore === routeAfter, 'serialize null: no navega ni actualiza el store');

    // Test: destroy limpia listeners
    // destroy hace push un no-op y no dispara hashchange desde Voyajer.
    // Un cambio directo del hash desde fuera tampoco debería reactivar
    // al store (los listeners están removidos).
    const store9 = createStatePulsar({});
    const voyajer9 = createVoyajer(store9, {
      mode: 'hash',
      parse: (url) => ({ path: url.pathname }),
      serialize: (state) => state.path,
    });

    voyajer9.destroy();
    voyajer9.push({ path: '/after-destroy' });
    // Sin await: push es no-op síncrono después de destroy.
    assert(window.location.hash !== '#/after-destroy', 'destroy: limpia listeners y no navega');

    // Test: getCurrent
    const store10 = createStatePulsar({ route: { path: '/custom' } });
    const voyajer10 = createVoyajer(store10, {
      mode: 'hash',
      parse: (url) => ({ path: url.pathname }),
      serialize: (state) => state.path,
      writeOnInit: false,
    });

    const current = voyajer10.getCurrent();
    assert(current.path === '/custom', 'getCurrent: lee el estado del store');

    // ============================================================
    // TESTS NUEVOS DEL PUNTO 3 DE FASE 0 (V-T1..V-T3)
    // ============================================================

    log('=== TEST 8: Idempotencia de push (V-T1) ===', 'info');
    // Contrato v0.2.1: si la URL serializada coincide con la actual,
    // push es no-op. No debe agregar entrada al historial ni notificar
    // a los subscribers del store.
    const store11 = createStatePulsar({});
    const voyajer11 = createVoyajer(store11, {
      mode: 'hash',
      parse: (url) => ({ path: url.pathname }),
      serialize: (state) => state.path,
      writeOnInit: false,
    });

    let pushNotifyCount = 0;
    store11.subscribeSelector('route', () => { pushNotifyCount++; });

    voyajer11.push({ path: '/idempotent' });
    const notifyAfterFirstPush = pushNotifyCount;
    assert(notifyAfterFirstPush === 1, 'push: primera navegación notifica una vez');

    // Segundo push con MISMO path: debe ser no-op.
    voyajer11.push({ path: '/idempotent' });
    assert(pushNotifyCount === notifyAfterFirstPush, 'push idempotente: segundo push idéntico no notifica');

    // Tercer push idéntico: sigue siendo no-op.
    voyajer11.push({ path: '/idempotent' });
    assert(pushNotifyCount === notifyAfterFirstPush, 'push idempotente: múltiples pushes idénticos no notifican');

    // Push distinto: sí notifica.
    voyajer11.push({ path: '/different' });
    assert(pushNotifyCount === notifyAfterFirstPush + 1, 'push a path distinto sí notifica');

    log('=== TEST 9: Idempotencia de replace (V-T1) ===', 'info');
    // Misma propiedad que push, aplicada a replace.
    const store12 = createStatePulsar({});
    const voyajer12 = createVoyajer(store12, {
      mode: 'hash',
      parse: (url) => ({ path: url.pathname }),
      serialize: (state) => state.path,
      writeOnInit: false,
    });

    let replaceNotifyCount = 0;
    store12.subscribeSelector('route', () => { replaceNotifyCount++; });

    voyajer12.push({ path: '/base' });
    const notifyAfterInitial = replaceNotifyCount;

    voyajer12.replace({ path: '/base' }); // idéntico a la posición actual
    assert(replaceNotifyCount === notifyAfterInitial, 'replace idempotente: replace al path actual no notifica');

    voyajer12.replace({ path: '/replaced' });
    assert(replaceNotifyCount === notifyAfterInitial + 1, 'replace a path distinto sí notifica');

    voyajer12.replace({ path: '/replaced' });
    assert(replaceNotifyCount === notifyAfterInitial + 1, 'replace idempotente: segundo replace idéntico no notifica');

    log('=== TEST 10: base con caracteres especiales (V-T3) ===', 'info');
    // El fix de _escapeRegex en Voyajer v0.2.1 previene que caracteres
    // como '.' o '+' en `base` se interpreten como metacaracteres del
    // regex al remover el prefijo del pathname. Este test verifica el
    // fix específicamente con un base que contiene '.'.
    //
    // Modo history: necesario porque `base` solo se aplica en history.
    // El pathname del browser cambia; se restaurará en el cleanup final.
    const store13 = createStatePulsar({});
    const voyajer13 = createVoyajer(store13, {
      mode: 'history',
      base: '/app.v2/',  // El punto es metacaracter en regex; debe escaparse.
      parse: (url) => ({ path: url.pathname }),
      serialize: (state) => state.path,
      writeOnInit: false,
    });

    voyajer13.push({ path: '/foo' });
    assert(window.location.pathname === '/app.v2/foo', 'base con "." se aplica correctamente al hacer push');

    const route13 = store13.getState().route;
    assert(route13.path === '/foo', 'base con "." se REMUEVE correctamente al parsear (el path virtual es /foo, no /app.v2/foo)');

    voyajer13.destroy();

    log('=== TEST 11: modo history — humo (V-T2) ===', 'info');
    // Verificación mínima de que el modo history escribe al store y
    // parsea correctamente. Sin back/forward para no depender del
    // servidor sirviendo paths arbitrarios (los tests con back/forward
    // en modo history quedan diferidos a Escena 3.3 con Playwright).
    const store14 = createStatePulsar({});
    const voyajer14 = createVoyajer(store14, {
      mode: 'history',
      parse: (url) => ({ path: url.pathname }),
      serialize: (state) => state.path,
      writeOnInit: false,
    });

    voyajer14.push({ path: '/tests/history-smoke' });
    assert(window.location.pathname === '/tests/history-smoke', 'modo history: push cambia pathname del browser');

    const route14 = store14.getState().route;
    assert(route14.path === '/tests/history-smoke', 'modo history: store refleja el path después de push');

    voyajer14.sync();
    const route14b = store14.getState().route;
    assert(route14b.path === '/tests/history-smoke', 'modo history: sync lee la URL actual y reafirma el store');

    voyajer14.destroy();

    // ============================================
    // CLEANUP FINAL
    // ============================================
    // Restaurar el pathname al valor original. Los tests de modo history
    // (10 y 11) cambiaron window.location.pathname. Sin esta restauración,
    // recargar la página produciría un 404 o cargaría un recurso distinto.
    // También limpiamos el hash residual de los tests anteriores.
    try {
      window.history.replaceState(null, '', ORIGINAL_PATHNAME + ORIGINAL_SEARCH + '#/');
      log(`ℹ️ Cleanup: pathname restaurado a ${ORIGINAL_PATHNAME}`, 'info');
    } catch (e) {
      log(`⚠️ Cleanup falló: ${e.message}`, 'info');
    }

    // ============================================
    // RESUMEN FINAL
    // ============================================
    const total = passed + failed;
    const summary = document.createElement('div');
    summary.className = 'summary';
    summary.innerHTML = `📊 Resultados: ${passed}/${total} pasaron. ${failed === 0 ? '🎉 ¡Todos los tests del contrato pasaron!' : '⚠️ Revisa los fallos.'}`;
    output.appendChild(summary);

    if (failed === 0) {
      document.body.style.background = '#1e3a2a';
    } else {
      document.body.style.background = '#3a1e1e';
    }
  </script>
</body>
</html>
